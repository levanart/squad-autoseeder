name: Build

on:
  push:
    branches:
      - main
      - dev
      - "release/**"
  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\autoseeder.slnx

      - name: Build
        run: dotnet build .\autoseeder.slnx --configuration Release --no-restore -p:ContinuousIntegrationBuild=true
