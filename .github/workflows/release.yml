name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validate tag and release branch
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$') {
            throw "Release tag must use the exact vMAJOR.MINOR.PATCH format. Received: $tag"
          }

          $version = $Matches.version
          $releaseBranch = "release/$tag"
          & git fetch --no-tags origin "+refs/heads/${releaseBranch}:refs/remotes/origin/${releaseBranch}"
          if ($LASTEXITCODE -ne 0) {
            throw "Required branch '$releaseBranch' does not exist on origin."
          }

          $tagCommit = (& git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {
            throw "Could not resolve tag '$tag' to a commit."
          }

          $branchCommit = (& git rev-parse "refs/remotes/origin/${releaseBranch}^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($branchCommit)) {
            throw "Could not resolve branch '$releaseBranch' to a commit."
          }

          if ($tagCommit -cne $branchCommit) {
            throw "Tag '$tag' points to $tagCommit, but '$releaseBranch' points to $branchCommit. Tag the branch tip."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_commit=$tagCommit" >> $env:GITHUB_OUTPUT
          "release_branch=$releaseBranch" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\Autoseeder.Client.csproj --runtime win-x64

      - name: Publish self-contained single-file application
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish-win-x64"
          dotnet publish .\Autoseeder.Client.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $output `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:ContinuousIntegrationBuild=true `
            -p:Deterministic=true `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -p:Version=$env:RELEASE_VERSION `
            -p:AssemblyVersion="${env:RELEASE_VERSION}.0" `
            -p:FileVersion="${env:RELEASE_VERSION}.0" `
            -p:InformationalVersion=$env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet publish failed with exit code $LASTEXITCODE."
          }

          $executable = Join-Path $output "5thMR.Autoseeder.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Published executable was not found at '$executable'."
          }

      - name: Determine signing mode
        id: signing
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CODE_SIGNING_PFX_PASSWORD)

          if ($hasPfx -xor $hasPassword) {
            throw "Configure both CODE_SIGNING_PFX_BASE64 and CODE_SIGNING_PFX_PASSWORD, or configure neither."
          }

          if ($hasPfx) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            "status=signed" >> $env:GITHUB_OUTPUT
          }
          else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "status=unsigned" >> $env:GITHUB_OUTPUT
            Write-Warning "Code-signing secrets are not configured; this draft release will be explicitly marked unsigned."
          }

      - name: Sign executable
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          CODE_SIGNING_PFX_BASE64: ${{ secrets.CODE_SIGNING_PFX_BASE64 }}
          CODE_SIGNING_PFX_PASSWORD: ${{ secrets.CODE_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $pfxPath = Join-Path $env:RUNNER_TEMP (([System.IO.Path]::GetRandomFileName()) + ".pfx")
          $executable = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish-win-x64\5thMR.Autoseeder.exe"
          $pfxBytes = $null

          try {
            $pfxBytes = [Convert]::FromBase64String($env:CODE_SIGNING_PFX_BASE64)
            [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

            $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
            $signTool = Get-ChildItem -LiteralPath $kitsRoot -Filter signtool.exe -File -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) {
              throw "signtool.exe (x64) was not found on the runner."
            }

            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr https://timestamp.digicert.com /f $pfxPath /p $env:CODE_SIGNING_PFX_PASSWORD $executable
            if ($LASTEXITCODE -ne 0) {
              throw "signtool sign failed with exit code $LASTEXITCODE."
            }

            & $signTool.FullName verify /pa /v $executable
            if ($LASTEXITCODE -ne 0) {
              throw "signtool verification failed with exit code $LASTEXITCODE."
            }
          }
          finally {
            if ($null -ne $pfxBytes) {
              [Array]::Clear($pfxBytes, 0, $pfxBytes.Length)
            }
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
          }

      - name: Package release assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.tag_commit }}
          SIGNING_STATUS: ${{ steps.signing.outputs.status }}
        run: |
          .\scripts\New-Release.ps1 `
            -Version $env:RELEASE_VERSION `
            -RuntimeIdentifier win-x64 `
            -OutputDirectory artifacts `
            -PublishDirectory artifacts\publish-win-x64 `
            -SkipPublish `
            -SigningStatus $env:SIGNING_STATUS `
            -SourceCommit $env:RELEASE_COMMIT

      - name: Create or update draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SIGNING_STATUS: ${{ steps.signing.outputs.status }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $archive = Join-Path $artifactRoot "5thMR.Autoseeder-$env:RELEASE_VERSION-win-x64.zip"
          $manifest = Join-Path $artifactRoot "release-manifest.json"
          $checksums = Join-Path $artifactRoot "SHA256SUMS.txt"
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.md"

          if ($env:SIGNING_STATUS -eq "signed") {
            $signatureNote = "The executable is Authenticode-signed and timestamped."
          }
          else {
            $signatureNote = "The executable is UNSIGNED because code-signing secrets were not configured. Verify SHA256SUMS.txt before distribution."
          }

          @"
          Windows x64 self-contained single-file build for 5thMR Autoseeder $env:RELEASE_VERSION.

          $signatureNote

          See release-manifest.json for machine-readable build and signing metadata.
          "@ | Set-Content -LiteralPath $notes -Encoding utf8

          $draftState = & gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draftState.Trim() -cne "true") {
              throw "Release '$env:RELEASE_TAG' already exists and is not a draft; refusing to replace published assets."
            }
            & gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=true --title "5thMR Autoseeder $env:RELEASE_VERSION" --notes-file $notes
          }
          else {
            & gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "5thMR Autoseeder $env:RELEASE_VERSION" --notes-file $notes
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create or update the draft GitHub Release."
          }

          & gh release upload $env:RELEASE_TAG $archive $manifest $checksums --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Could not upload release assets."
          }
